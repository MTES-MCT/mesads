volumes:
  db: {}
  app-poetry: {}
  clamav-data: {}

services:
  maildev:
    image: djfarrelly/maildev
    ports:
      - 1025:80

  db:
    image: postgres:15
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: mesads
      POSTGRES_DB: mesads
    ports:
      - 9432:5432

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  app:
    build:
      context: .
      target: local
    volumes:
      - .:/app
      - app-poetry:/home/mesads/.cache/pypoetry
    depends_on:
      - db
      - maildev
      - clamav
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - '9400:8000'
